<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="bg-transparent text-gray-800 antialiased font-sans flex items-center justify-center h-screen p-0 overflow-hidden relative" style="margin: 0; padding: 0;">

    <div id="loader-overlay" class="fixed inset-0 bg-white/80 z-[999] hidden flex-col items-center justify-center backdrop-blur-md">
      <div class="relative flex items-center justify-center">
        <div class="absolute w-8 h-8 border-2 border-indigo-500/20 rounded-full"></div>
        <div class="w-8 h-8 border-2 border-transparent border-t-indigo-600 rounded-full animate-spin"></div>
      </div>
      <div class="mt-2 text-center">
        <p id="loader-text" class="text-[9px] font-medium text-slate-600 tracking-wider">Loading...</p>
      </div>
    </div>

    <!-- Container with Dynamic Floating Orbs Background -->
    <div class="relative w-full max-w-[320px] flex items-center justify-center">

      <!-- Moving Ambient Orbs Behind the Card -->
      <div class="absolute -top-1 left-4 w-12 h-12 bg-indigo-400/25 rounded-full blur-lg animate-orbit-1 pointer-events-none"></div>
      <div class="absolute -bottom-1 right-4 w-14 h-14 bg-purple-400/25 rounded-full blur-lg animate-orbit-2 pointer-events-none"></div>

      <!-- Rotating Glowing Border Card -->
      <div class="relative w-full p-[1.5px] rounded-lg overflow-hidden shadow-md shadow-indigo-500/10 animate-float-card group z-10">
        <div class="absolute inset-0 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 animate-border-glow"></div>

        <!-- Inner Glass Card Content -->
        <div class="relative bg-white/95 backdrop-blur-2xl rounded-[8px] px-3 py-2 flex items-center justify-between transition-transform duration-300 group-hover:scale-[1.01]">
          <div class="flex items-center gap-2.5">
            <div class="w-7 h-7 rounded-md bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shrink-0 shadow-sm shadow-indigo-500/30 transition-transform duration-300 group-hover:rotate-12 group-hover:scale-105">
              <svg class="w-3.5 h-3.5 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </div>
            <div>
              <div class="flex items-center gap-1 mb-0">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>
                <p class="text-[8px] font-bold uppercase tracking-wider text-indigo-600">Outstanding Receivables</p>
              </div>
              <div id="receivables-value" class="text-base font-black bg-gradient-to-r from-slate-900 to-indigo-950 bg-clip-text text-transparent tracking-tight">--</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Popup (only "hidden" in markup; JS toggles hidden/flex) -->
    <div class="fixed inset-0 bg-slate-900/50 z-[1000] hidden items-center justify-center p-3 backdrop-blur-sm" id="popup" data-status="">
      <div class="bg-white rounded-lg p-3 text-center shadow-xl w-full max-w-[220px] border border-slate-100 animate-slide-up">
        <div id="statusIcon" class="mx-auto flex items-center justify-center h-8 w-8 rounded-full mb-2"></div>
        <h3 id="popupTitle" class="text-[11px] font-bold text-slate-900 mb-0.5">Notification</h3>
        <p id="popupMessage" class="text-[9px] text-slate-500 leading-relaxed mb-2.5"></p>
        <button type="button" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-1.5 px-3 rounded-md text-[9px] transition-colors" id="closeBtn" onclick="hidePopup()">Close</button>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
